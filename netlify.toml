[build]
  command = "npm run build"
  publish = "dist"
  # Ignorar builds automáticos si no estamos en la rama main para ahorrar minutos
  ignore = "test \"$BRANCH\" != \"main\""

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 4321
  publish = "dist"
  framework = "astro"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200